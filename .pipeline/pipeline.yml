# .pipeline/pipeline.yml
# Azure DevOps CI/CD - Sistema de Control de Fumigación

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  NODE_VERSION: '20.x'
  ARTIFACT_NAME: 'app-fumigacion-backend-$(Build.BuildId).tar.gz'

# ============================================================
# STAGE 1 - COMPILACIÓN
# ============================================================

stages:
- stage: Compile
  displayName: 'Compilación'
  jobs:
  - job: CompileApp
    displayName: 'Compilar aplicación'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm run build
      displayName: 'Compilar aplicación'

# ============================================================
# STAGE 2 - QUALITY GATES
# ============================================================

- stage: QualityGates
  displayName: 'Quality Gates'
  dependsOn: Compile
  condition: succeeded()

  jobs:

  - job: Lint
    displayName: 'Lint'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm run lint
      displayName: 'Ejecutar ESLint'


  - job: StaticAnalysis
    displayName: 'Análisis estático'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: |
        npx sonar-scanner \
          -Dsonar.projectKey=fumigacion-backend \
          -Dsonar.qualitygate.wait=true
      displayName: 'Ejecutar SonarQube'


  - job: UnitTests
    displayName: 'Pruebas unitarias'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm test -- --ci --coverage
      displayName: 'Ejecutar pruebas unitarias'


  - job: ValidateSQL
    displayName: 'Validar esquema SQL'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm install --no-save sql-parser-cst
      displayName: 'Instalar sql-parser-cst'

    - script: node scripts/validar-sql.js scripts/schema.sql
      displayName: 'Validar schema.sql'

    - script: node scripts/validar-sql.js scripts/seed.sql
      displayName: 'Validar seed.sql'


# ============================================================
# STAGE 3 - PACKAGE
# ============================================================

- stage: Package
  displayName: 'Empaquetado'
  dependsOn: QualityGates
  condition: succeeded()

  jobs:
  - job: PackageApp
    displayName: 'Crear paquete de aplicación'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm prune --production
      displayName: 'Eliminar dependencias de desarrollo'

    - script: |
        tar -czf "$(ARTIFACT_NAME)" \
          package.json \
          src \
          scripts \
          node_modules
      displayName: 'Crear archivo TAR.GZ'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar artefacto'
      inputs:
        targetPath: '$(ARTIFACT_NAME)'
        artifact: 'fumigacion-backend'
        publishLocation: 'pipeline'


# ============================================================
# STAGE 4 - DEPLOY DEV
# ============================================================

- stage: DeployDev
  displayName: 'Deploy DEV'
  dependsOn: Package
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))

  jobs:
  - deployment: DeployDevelopment
    displayName: 'Desplegar en DEV'
    environment: 'dev'
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: fumigacion-backend

          - script: chmod +x ./scripts/deploy.sh
            displayName: 'Dar permisos al script'

          - script: |
              echo "Desplegando aplicación en entorno DEV"
              ./scripts/deploy.sh dev
            displayName: 'Desplegar en DEV'

          - script: |
              echo "Verificando aplicación DEV..."
              curl -f "$(DEV_URL)/health"
            displayName: 'Verificar DEV'


# ============================================================
# STAGE 5 - DEPLOY QA
# ============================================================

- stage: DeployQA
  displayName: 'Deploy QA'
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))

  jobs:
  - deployment: DeployQuality
    displayName: 'Desplegar en QA'
    environment: 'qa'
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: fumigacion-backend

          - script: chmod +x ./scripts/deploy.sh
            displayName: 'Dar permisos al script'

          - script: |
              echo "Desplegando aplicación en entorno QA"
              ./scripts/deploy.sh qa
            displayName: 'Desplegar en QA'

          - script: |
              curl -f "$(QA_URL)/health"
            displayName: 'Verificar QA'

          - task: NodeTool@0
            displayName: 'Instalar Node.js'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Instalar dependencias'

          - script: npm run test:integration
            displayName: 'Pruebas de integración'


# ============================================================
# STAGE 6 - DEPLOY PRODUCCIÓN
# ============================================================

- stage: DeployProd
  displayName: 'Deploy PROD'
  dependsOn: Package
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: DeployProduction
    displayName: 'Desplegar en PROD'
    environment: 'prod'
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: fumigacion-backend

          - script: chmod +x ./scripts/deploy.sh
            displayName: 'Dar permisos al script'

          - script: |
              echo "Desplegando aplicación en entorno PROD"
              ./scripts/deploy.sh prod
            displayName: 'Desplegar en PROD'

          - script: |
              curl -f "$(PROD_URL)/health"
            displayName: 'Verificar PROD'