# ============================================================
# Azure DevOps CI/CD
# Sistema de Control de Fumigación - Backend
# Despliegue en Azure App Service (Linux, Node.js)
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  NODE_VERSION: '22.x'
  ARTIFACT_NAME: 'app-fumigacion-backend-$(Build.BuildId).zip'
  # --- CAMBIA ESTOS 3 VALORES ---
  AZURE_SERVICE_CONNECTION: 'azure-fumigacion'
  WEBAPP_DEV: 'fumigacion-backend-julianbello'
  WEBAPP_PROD: 'fumigacion-backend-julianbello'
  BACKEND_URL: 'https://fumigacion-backend-julianbello.azurewebsites.net'
  FRONTEND_URL: 'https://fumigacion-frontend-julianbello.azurewebsites.net'
  # --- SonarCloud: déjalo en 'false' hasta tenerlo configurado ---
  RUN_SONAR: 'false'
  SONAR_SERVICE_CONNECTION: 'sonarcloud-fumigacion'
  SONAR_ORGANIZATION: 'julianbello'
  SONAR_PROJECT_KEY: 'Julianbello_Fumigacion-Backend'

stages:

# ============================================================
# STAGE 1 - VALIDACIÓN
# ============================================================

- stage: Compile
  displayName: 'Validación de aplicación'
  jobs:
    - job: CompileApp
      displayName: 'Validar backend Node.js'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: 'Instalar Node.js'
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm install --no-audit --no-fund --ignore-scripts
          displayName: 'Instalar dependencias'

        - script: |
            test -f src/server.js
            echo "src/server.js encontrado"
          displayName: 'Validar archivo principal'

        - script: node --check src/server.js
          displayName: 'Validar sintaxis JavaScript'

# ============================================================
# STAGE 2 - QUALITY GATES
# ============================================================

- stage: QualityGates
  displayName: 'Quality Gates'
  dependsOn: Compile
  condition: succeeded()
  jobs:
    - job: UnitTests
      displayName: 'Pruebas unitarias'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: 'Instalar Node.js'
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: |
            which node
            node --version
            which npm
            npm --version
          displayName: 'Diagnóstico de Node'

        - script: npm install --no-audit --no-fund --ignore-scripts
          displayName: 'Instalar dependencias'

        - script: npm test -- --coverage
          displayName: 'Ejecutar pruebas unitarias (Jest)'

    - job: ValidateScripts
      displayName: 'Validar scripts'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: 'Instalar Node.js'
          inputs:
            versionSpec: '$(NODE_VERSION)'

        - script: npm install --no-audit --no-fund --ignore-scripts
          displayName: 'Instalar dependencias'

        - script: node --check scripts/validar-sql.js
          displayName: 'Validar validar-sql.js'

        - script: node --check scripts/seed.js
          displayName: 'Validar seed.js'

    - ${{ if eq(variables['RUN_SONAR'], 'true') }}:
      - job: SonarCloud
        displayName: 'Análisis de código (SonarCloud)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Instalar Node.js'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - task: SonarCloudPrepare@4
            displayName: 'SonarCloud: preparar análisis'
            inputs:
              SonarCloud: '$(SONAR_SERVICE_CONNECTION)'
              organization: '$(SONAR_ORGANIZATION)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(SONAR_PROJECT_KEY)'
              cliProjectName: 'fumigacion-backend'
              cliSources: 'src,api'

          - script: npm install --no-audit --no-fund --ignore-scripts
            displayName: 'Instalar dependencias'

          - script: npm test -- --coverage
            displayName: 'Pruebas con cobertura (para SonarCloud)'

          - task: SonarCloudAnalyze@4
            displayName: 'SonarCloud: analizar código'
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          - task: SonarCloudPublish@4
            displayName: 'SonarCloud: publicar resultado del Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

# ============================================================
# STAGE 3 - PACKAGE
# App Service instala las dependencias al desplegar
# (SCM_DO_BUILD_DURING_DEPLOYMENT=true), por eso el ZIP
# no lleva node_modules.
# ============================================================

- stage: Package
  displayName: 'Empaquetado'
  dependsOn: QualityGates
  condition: succeeded()
  jobs:
    - job: PackageApp
      displayName: 'Crear paquete de aplicación'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - script: |
            zip -qr "$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)" package.json package-lock.json src scripts
            ls -lh "$(Build.ArtifactStagingDirectory)"
          displayName: 'Crear archivo ZIP'

        - task: PublishPipelineArtifact@1
          displayName: 'Publicar artefacto'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'
            artifact: 'fumigacion-backend'
            publishLocation: 'pipeline'

# ============================================================
# STAGE 4 - DEPLOY DEV
# ============================================================

- stage: DeployDev
  displayName: 'Deploy DEV'
  dependsOn: Package
  condition: |
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/develop'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    )
  jobs:
    - deployment: DeployDevelopment
      displayName: 'Desplegar en DEV'
      environment: 'dev'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                displayName: 'Desplegar en App Service (DEV)'
                inputs:
                  azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                  appType: 'webAppLinux'
                  appName: '$(WEBAPP_DEV)'
                  runtimeStack: 'NODE|22-lts'
                  package: '$(Pipeline.Workspace)/fumigacion-backend/*.zip'

# ============================================================
# STAGE 5 - DEPLOY PROD
# ============================================================

- stage: DeployProd
  displayName: 'Deploy PROD'
  dependsOn: Package
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
    - deployment: DeployProduction
      displayName: 'Desplegar en PROD'
      environment: 'prod'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                displayName: 'Desplegar en App Service (PROD)'
                inputs:
                  azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                  appType: 'webAppLinux'
                  appName: '$(WEBAPP_PROD)'
                  runtimeStack: 'NODE|22-lts'
                  package: '$(Pipeline.Workspace)/fumigacion-backend/*.zip'

# ============================================================
# STAGE 6 - ESCANEO DE SEGURIDAD (ZAP)
# Lighthouse mide páginas web: se ejecuta sobre el frontend que usa esta API.
# ============================================================

- stage: SecurityScans
  displayName: 'Escaneo de seguridad (ZAP y Lighthouse)'
  dependsOn: DeployProd
  condition: succeeded()
  jobs:
    - job: ZapBaseline
      displayName: 'OWASP ZAP (baseline)'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: none

        - script: |
            for i in 1 2 3 4 5 6; do
              curl -fsS -o /dev/null "$(BACKEND_URL)/health" && break
              sleep 15
            done
          displayName: 'Despertar el backend'

        - script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/zap"
            chmod 777 "$(Build.ArtifactStagingDirectory)/zap"
            docker run --rm -v "$(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw" \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "$(BACKEND_URL)/health" -r zap-backend-reporte.html -I
          displayName: 'Escaneo baseline de ZAP'

        - publish: '$(Build.ArtifactStagingDirectory)/zap'
          artifact: zap-backend
          condition: succeededOrFailed()

    - job: ZapApi
      displayName: 'OWASP ZAP (API con OpenAPI, modo seguro)'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - script: |
            for i in 1 2 3 4 5 6; do
              curl -fsS -o /dev/null "$(BACKEND_URL)/health" && break
              sleep 15
            done
          displayName: 'Despertar el backend'

        - script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/zap-api"
            cp openapi.json "$(Build.ArtifactStagingDirectory)/zap-api/openapi.json"
            chmod -R 777 "$(Build.ArtifactStagingDirectory)/zap-api"
            docker run --rm -v "$(Build.ArtifactStagingDirectory)/zap-api:/zap/wrk/:rw" \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -r zap-api-reporte.html -S -I
          displayName: 'Escaneo de la API con ZAP (sin ataques)'
          continueOnError: true

        - publish: '$(Build.ArtifactStagingDirectory)/zap-api'
          artifact: zap-api
          condition: succeededOrFailed()

    - job: LighthouseFrontend
      displayName: 'Lighthouse (sobre el frontend que usa esta API)'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: none

        - task: NodeTool@0
          displayName: 'Instalar Node.js 22'
          inputs:
            versionSpec: '22.x'

        - script: |
            for i in 1 2 3 4 5; do
              curl -fsS -o /dev/null "$(FRONTEND_URL)/login.html" && break
              sleep 15
            done
          displayName: 'Despertar el frontend'

        - script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/lighthouse"
            npx --yes lighthouse "$(FRONTEND_URL)/login.html" \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=html --output=json \
              --output-path="$(Build.ArtifactStagingDirectory)/lighthouse/reporte" --quiet
          displayName: 'Ejecutar Lighthouse'

        - publish: '$(Build.ArtifactStagingDirectory)/lighthouse'
          artifact: lighthouse-backend
          condition: succeeded()